<!DOCTYPE html>
<html>
<head>
    <title>Comology </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./Style.css" type="text/css" media="all" />
</head>
<body>
    <div id="start-screen">
        <div id="start-content">
            <h1>COMOLOGY</h1>
            <h2>Las afueras de Tyni City</h2>
            <button id="start-button">Iniciar</button>
        </div>
    </div>
    
    <div id="game-container">
        <div id="world-screen" style="display: none;">
            <canvas id="world-canvas" width="800" height="600"></canvas>
        </div>
        <div id="battle-screen" style="display: none;">
            <canvas id="battle-canvas" width="800" height="600"></canvas>
            <div class="health-bar" id="enemy-health-container">
                <div id="enemy-health" class="health-fill"></div>
            </div>
            <div class="health-bar" id="player-health-container">
                <div id="player-health" class="health-fill"></div>
            </div>
        </div>
        <div id="text-box">
            <div id="dialogue-text"></div>
            <div id="options-container"></div>
        </div>
        <div id="ally-swap-modal" class="modal" style="display: none;">
            <div class="modal-content ally-selector-content">
                <h2 id="ally-selector-message">Elige a tu acompañante</h2>
                <div id="ally-selector-container" class="ally-selector-grid"></div>
                <button id="ally-selector-close" class="modal-button">Cerrar</button>
            </div>
        </div>
        <div id="mobile-controls" class="hidden">
            <div class="dpad">
                <button id="btn-up" class="dpad-btn" aria-label="Arriba"></button>
                <div class="dpad-row">
                    <button id="btn-left" class="dpad-btn" aria-label="Izquierda"></button>
                    <button id="btn-down" class="dpad-btn" aria-label="Abajo"></button>
                    <button id="btn-right" class="dpad-btn" aria-label="Derecha"></button>
                </div>
            </div>
            <div class="action-buttons">
                <button id="btn-interact" class="action-btn" aria-label="Interactuar">E</button>
                <button id="btn-jump" class="action-btn" aria-label="Saltar">B</button>
                <button id="btn-attack" class="action-btn" aria-label="Atacar">A</button>
            </div>
            <button id="toggle-touch-btn" class="toggle-touch-btn">Ocultar Controles</button>
        </div>
    </div>

    <div id="game-over-modal" class="modal">
        <div class="modal-content">
            <h2>☠️ GAME OVER ☠️</h2>
            <button id="restart-button" class="modal-button">Reintentar</button>
        </div>
    </div>

    <div id="victory-modal" class="modal">
        <div class="modal-content victory-style">
            <h2>🎉 ¡VICTORIA! 🎉</h2>
            <p>«Vaya, eres más fuerte de lo que esperaba. ¡Bien hecho!»</p>
            <button id="victory-button" class="modal-button">Jugar de nuevo</button>
        </div>
    </div>
    <div id="flash-overlay"></div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
